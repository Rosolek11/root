<div class="form-group"><label for="brand">Marka</label><input type="text" id="brand" name="brand" value="{{ car['brand']|default('') }}" required></div>
<div class="form-group"><label for="model">Model</label><input type="text" id="model" name="model" value="{{ car['model']|default('') }}" required></div>
<div class="form-group"><label for="production_year">Rok produkcji</label><input type="number" id="production_year" name="production_year" value="{{ car['production_year']|default('') }}" required></div>
<div class="form-group"><label for="fuel_type">Typ paliwa</label><select id="fuel_type" name="fuel_type" required><option value="">Wybierz...</option>{% for fuel_type in fuel_types %}<option value="{{ fuel_type }}" {% if car['fuel_type']|default('') == fuel_type %}selected{% endif %}>{{ fuel_type }}</option>{% endfor %}</select></div>
<div class="form-group"><label for="horsepower">Moc (KM)</label><input type="number" id="horsepower" name="horsepower" value="{{ car['horsepower']|default('') }}" required></div>
<div class="form-group"><label></label><input type="submit" value="Zapisz"></div>

{% extends "base.html" %}
{% block title %}Edytuj samochód{% endblock %}
{% block body_class %}edit{% endblock %}
{% block content %}<h1>Edytuj {{ car['brand'] }} {{ car['model'] }} ({{ car['id'] }})</h1><form method="post" class="edit-form">{% include "car/_form.html" %}</form><ul class="action-list"><li><a href="{{ url_for('car_index') }}">Powrót do listy</a></li><li><form method="post" action="{{ url_for('car_delete', car_id=car['id']) }}"><input type="submit" value="Usuń"></form></li></ul>{% endblock %}
